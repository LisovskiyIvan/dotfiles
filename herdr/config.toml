onboarding = false
[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = false
status_indicators = "dots"
[keys]
prefix = "ctrl+a"

# Workspaces (Rex: session.new/switch/rename/close)
# Ctrl+j/k = down/up, Alt+j/k kept as fallback (Latin + Cyrillic for Russian layout)
next_workspace = ["alt+j", "alt+о", "ctrl+j", "ctrl+о"]
previous_workspace = ["alt+k", "alt+л", "ctrl+k", "ctrl+л"]
new_workspace = ["prefix+shift+n", "prefix+w"]
workspace_picker = "prefix+u"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

# Tabs (Rex: prefix+t/c, prefix+n/p, prefix+shift+t/x, prefix+1..9)
# Ctrl+h/l and Alt+h/l = left/right (Latin + Cyrillic for Russian layout)
previous_tab = ["prefix+p", "alt+h", "alt+р", "ctrl+h", "ctrl+р"]
next_tab = ["prefix+n", "alt+l", "alt+д", "ctrl+l", "ctrl+д"]
new_tab = ["prefix+c", "prefix+t"]
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"
switch_tab = "prefix+1..9"

# Panes: prefix+h/j/k/l moves between real splits. Ctrl+h/l switch tabs above,
# Ctrl+j/k switch workspaces.
focus_pane_left = ["prefix+h"]
focus_pane_down = ["prefix+j"]
focus_pane_up = ["prefix+k"]
focus_pane_right = ["prefix+l"]
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
split_vertical = ["prefix+v", "ctrl+v"]
split_horizontal = "prefix+minus"
close_pane = ["prefix+x", "ctrl+x"]
zoom = ["prefix+z", "alt+z", "ctrl+w"]
resize_mode = "prefix+r"

# Other (Rex)
toggle_sidebar = "prefix+b"
reload_config = "prefix+shift+r"
settings = "prefix+s"

[theme]
name = "catppuccin"
auto_switch = false

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[ui.sidebar]

[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "tab"], ["agent"]]

[experimental]
kitty_graphics = true
switch_ascii_input_source_in_prefix = true

[theme.custom]
accent = "#7aa2f7"
panel_bg = "#13141c"
active_row_bg = "#1f2230"
selection_bg = "#292e42"
surface0 = "#24283b"
surface1 = "#414868"
surface_dim = "#1a1b26"
overlay0 = "#565f89"
overlay1 = "#6f78a0"
text = "#a9b1d6"
subtext0 = "#8c94bb"
mauve = "#bb9af7"
green = "#9ece6a"
yellow = "#e0af68"
red = "#f7768e"
blue = "#7aa2f7"
teal = "#449dab"
peach = "#eb927b"
