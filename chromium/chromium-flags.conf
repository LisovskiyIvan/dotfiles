# Chromium on the NVIDIA dGPU. The panel is wired to the AMD iGPU, and
# Chromium's native Wayland path cannot import NVIDIA DMA-BUFs on this stack
# ("importing the supplied dmabufs failed"), so use XWayland instead. The
# session env (__GLX_VENDOR_LIBRARY_NAME=nvidia) makes GLX pick the RTX.
--ozone-platform=x11
--ozone-platform-hint=x11
# Match the panel's Hyprland scale (1.6). XWayland otherwise rounds it to 2.
# Update this if the monitor scale changes.
--force-device-scale-factor=1.6
--password-store=gnome-libsecret
--enable-features=TouchpadOverscrollHistoryNavigation,OverlayScrollbar
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim
--no-default-browser-check
--force-renderer-accessibility

# NVIDIA VA-API currently crashes the GPU process (gbm_bo_import returns
# null) while the browser renders on the dGPU. Decode video in software until
# Chromium handles NVIDIA DMA-BUF imports.
--disable-features=VaapiOnNvidiaGPUs
