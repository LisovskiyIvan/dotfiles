# Aerospace config — i3/Hyprland-like on macOS
# Модификатор: cmd

config-version = 2
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
start-at-login = true

[gaps]
inner.horizontal = 6
inner.vertical   = 6
outer.left       = 4
outer.bottom     = 4
outer.top        = 4
outer.right      = 4

[mode.main.binding]

# terminal
cmd-enter = 'exec-and-forget open -na /Applications/Ghostty.app'

# layout
cmd-slash  = 'layout tiles horizontal vertical'
cmd-comma  = 'layout horizontal'
cmd-period = 'layout vertical'

# focus
cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

# move
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'

# resize width
cmd-equal = 'resize smart +50'
cmd-minus = 'resize smart -50'

# workspace
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

# move to workspace
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'

# prev/next workspace
cmd-left  = 'workspace --wrap-around prev'
cmd-right = 'workspace --wrap-around next'

# swap
cmd-shift-left  = 'swap left'
cmd-shift-down  = 'swap down'
cmd-shift-up    = 'swap up'
cmd-shift-right = 'swap right'

# back-and-forth
cmd-tab     = 'workspace-back-and-forth'
cmd-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# fullscreen / float
cmd-f     = 'macos-native-fullscreen'
cmd-space = 'layout floating tiling'

# close
cmd-q = 'close'

# service mode (resize, join, etc.)
cmd-shift-semicolon = 'mode service'

[mode.service.binding]
esc     = ['reload-config', 'mode main']
r       = ['flatten-workspace-tree', 'mode main']
f       = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
h       = ['resize smart -50', 'mode main']
j       = ['resize smart +50', 'mode main']
k       = ['resize smart -50', 'mode main']
l       = ['resize smart +50', 'mode main']
shift-h = ['join-with left', 'mode main']
shift-j = ['join-with down', 'mode main']
shift-k = ['join-with up', 'mode main']
shift-l = ['join-with right', 'mode main']
s       = 'mode swap'

[mode.swap.binding]
esc = ['mode main']
h   = ['swap left', 'mode main']
j   = ['swap down', 'mode main']
k   = ['swap up', 'mode main']
l   = ['swap right', 'mode main']

# ── float these apps ──────────────────────────────────
[[on-window-detected]]
if.app-id = "com.apple.finder"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.apple.systempreferences"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.apple.calculator"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.1password.1password"
run = "layout floating"
